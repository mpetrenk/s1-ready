[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "s1-ready"
version = "0.1.0"
description = "Turn any data with a decision attached into a decontaminated, calibrated, System 1 (decision-model)-ready dataset."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "System 1 Ready" }]
keywords = ["decision-model", "system1", "dataset", "labeling", "unsloth", "calibration"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Zero hard runtime deps: the core pipeline runs on the stdlib so the vertical
# slice works out of the box. LLM teachers are optional plug-ins.
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.0", "anthropic>=0.40", "boto3>=1.28"]
dev = ["pytest>=7"]

[project.scripts]
s1-ready = "s1_ready.cli:main"
s1ready = "s1_ready.cli:main"

[project.urls]
Homepage = "https://github.com/mpetrenk/s1-ready"
Repository = "https://github.com/mpetrenk/s1-ready"

[tool.setuptools.packages.find]
where = ["."]
include = ["s1_ready*"]
